# Tests de bout en bout Playwright, en lancement manuel uniquement (onglet Actions > Playwright > Run workflow).
# Ils ne tournent pas à chaque push : ils exigent des comptes de test et la clé serveur Supabase,
# qui ne sont donc exposés à GitHub qu'à la demande. Cible : l'URL de staging (jamais la production).
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) avant le premier lancement :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   E2E_STAFF_EMAIL, E2E_STAFF_PASSWORD, E2E_PARENT1_EMAIL, E2E_PARENT1_PASSWORD,
#   E2E_PARENT2_EMAIL, E2E_PARENT2_PASSWORD, E2E_VERCEL_BYPASS
# Le test d'invitation envoie de vrais emails vers EMAIL_TEST_RECIPIENT (réglé côté Vercel Preview).
name: Playwright

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de staging à tester (Vercel Preview de la branche staging)"
        required: true
        default: "https://lespetitspas-git-staging-oc-jguirado.vercel.app"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests Playwright
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_VERCEL_BYPASS: ${{ secrets.E2E_VERCEL_BYPASS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_PARENT1_EMAIL: ${{ secrets.E2E_PARENT1_EMAIL }}
          E2E_PARENT1_PASSWORD: ${{ secrets.E2E_PARENT1_PASSWORD }}
          E2E_PARENT2_EMAIL: ${{ secrets.E2E_PARENT2_EMAIL }}
          E2E_PARENT2_PASSWORD: ${{ secrets.E2E_PARENT2_PASSWORD }}

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
